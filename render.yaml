# ==============================================================================
# EduTracker - Render Blueprint: ONE free Docker web service, ONE URL.
# Apache/PHP serves the pages; Node/Express runs inside the same container.
# ==============================================================================

services:
  - type: web
    name: edutracker
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # MongoDB Atlas (fill in on Render)
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: edutracker
      # Shared PHP <-> Node key (generated by Render)
      - key: API_KEY
        generateValue: true
      # First admin (used only if Atlas has no admin yet)
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      # Gmail notifications (optional)
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
