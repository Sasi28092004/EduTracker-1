# ==============================================================================
# EduTracker - Apache Virtual Host Configuration
# Place this file at: /etc/apache2/sites-available/edutracker.conf
# Enable site: sudo a2ensite edutracker.conf
# ==============================================================================

<VirtualHost *:80>
    # Replace with your domain name or public server IP
    ServerName your-server-ip-or-domain.com
    # ServerAlias www.your-server-ip-or-domain.com

    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/edutracker

    DirectoryIndex index.php frontend/index.html index.html

    # --------------------------------------------------------------------------
    # Main Directory Settings
    # --------------------------------------------------------------------------
    <Directory /var/www/edutracker>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # --------------------------------------------------------------------------
    # Security: Block sensitive files from browser access
    # --------------------------------------------------------------------------
    # Deny access to .env files
    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>

    # Deny direct browser access to backend source, database dumps and git
    <Directory /var/www/edutracker/server>
        <FilesMatch "\.(env|json|lock|js)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <Directory /var/www/edutracker/database>
        Require all denied
    </Directory>

    <DirectoryMatch "/\.git">
        Require all denied
    </DirectoryMatch>

    # --------------------------------------------------------------------------
    # Reverse Proxy to Node.js / Express API (Port 3000)
    # Requires: sudo a2enmod proxy proxy_http
    # --------------------------------------------------------------------------
    ProxyRequests Off
    ProxyPreserveHost On

    # Route uploaded assignment PDFs directly through Apache to Express
    ProxyPass /uploads/assignments http://127.0.0.1:3000/uploads/assignments
    ProxyPassReverse /uploads/assignments http://127.0.0.1:3000/uploads/assignments

    # Route API calls directly to Express
    ProxyPass /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api

    # --------------------------------------------------------------------------
    # PHP Upload Limit Directives (Matches 10MB Assignment Limit)
    # --------------------------------------------------------------------------
    <IfModule mod_php.c>
        php_value upload_max_filesize 10M
        php_value post_max_size 12M
        php_value memory_limit 128M
        php_value max_execution_time 60
    </IfModule>

    # --------------------------------------------------------------------------
    # Logging
    # --------------------------------------------------------------------------
    ErrorLog ${APACHE_LOG_DIR}/edutracker_error.log
    CustomLog ${APACHE_LOG_DIR}/edutracker_access.log combined
</VirtualHost>
