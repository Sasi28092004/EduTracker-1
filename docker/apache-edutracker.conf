# EduTracker: Apache serves the PHP pages and forwards API + uploaded files to Node.
ServerName localhost

ProxyPreserveHost On
ProxyTimeout 120

# JSON API (also used by Render's health check: /api/health)
ProxyPass        /api/     http://127.0.0.1:3000/api/
ProxyPassReverse /api/     http://127.0.0.1:3000/api/

# Uploaded assignment PDFs
ProxyPass        /uploads/ http://127.0.0.1:3000/uploads/
ProxyPassReverse /uploads/ http://127.0.0.1:3000/uploads/
